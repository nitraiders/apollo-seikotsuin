<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="埼玉県草加市のアポロ整骨院。新田駅徒歩12分、完全個室のプライベート空間でリラックス。交通事故施術（0円）、全身マッサージ、足つぼなど。一人ひとりに合わせた丁寧な施術で心身ともにリフレッシュ。">
    <meta name="keywords" content="アポロ整骨院, 草加市, 新田駅, 整骨院, 交通事故施術, マッサージ, 骨盤矯正, 完全個室">
    <meta property="og:title" content="アポロ整骨院 | 草加市のマッサージ・整体・交通事故施術">
    <meta property="og:description" content="完全個室のプライベート整骨院。交通事故施術は0円。一人ひとりに合わせた丁寧な施術。">
    <meta property="og:image" content="https://apollo-seikotsuin.pages.dev/images/logo.png">
    <meta property="og:url" content="https://apollo-seikotsuin.pages.dev/">
    <meta property="og:type" content="website">
    <title>口コミ｜アポロ整骨院 公式サイト</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- LLMO / Structured Data -->
    <script type="application/ld+json">
    {
  "@context": "https://schema.org",
  "@type": "PhysiotherapyClinic",
  "name": "アポロ整骨院",
  "image": "https://apollo-seikotsuin.pages.dev/images/logo.png",
  "@id": "https://apollo-seikotsuin.pages.dev/",
  "url": "https://apollo-seikotsuin.pages.dev/",
  "telephone": "048-954-5511",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "新善町513-10",
    "addressLocality": "草加市",
    "addressRegion": "埼玉県",
    "postalCode": "340-0054",
    "addressCountry": "JP"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 35.844781,
    "longitude": 139.79155
  },
  "openingHoursSpecification": [
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday"
      ],
      "opens": "09:00",
      "closes": "20:00"
    }
  ],
  "sameAs": [
    "https://tol-app.jp/s/apollo",
    "https://lin.ee/6cYRjnW"
  ],
  "description": "埼玉県草加市・新田駅徒歩12分。完全個室のプライベート整骨院。交通事故施術は自賠責保険適用で0円。全身もみほぐし、足つぼ、骨盤矯正など、一人ひとりに合わせた丁寧な施術を提供します。"
}
    </script>
</head>
<body>

    <header class="g-header">
        <div class="inner">
            <img src="images/logo.png" alt="アポロ整骨院" class="site-logo" fetchpriority="high">
        </div>
    </header>

    <div class="main-wrap">
        <header class="salon-header">
            <div class="salon-info-left">
                <div class="catchphrase">草加市・新田駅徒歩12分｜完全個室のプライベートサロン</div>
                <h1 class="salon-name">アポロ整骨院</h1>
                <div class="catch-sub">交通事故施術は0円</div>
                <div class="catch-link"><a href="accident.html" target="_blank">詳しくはこちら</a></div>
            </div>
            <div class="salon-actions">
                <a href="https://lin.ee/6cYRjnW" class="btn-reserve-brand">LINEで予約</a>
                <a href="https://tol-app.jp/s/apollo" class="btn-reserve-net">ネット予約(24ｈ)</a>
            </div>
        </header>

        <nav>
            <ul class="tabs-nav">
                <li class=""><a href="index.html">ホーム</a></li>
                <li class=""><a href="menu.html">メニュー</a></li>
                <li class=""><a href="staff.html">スタッフ</a></li>
                <li class=""><a href="map.html">地図</a></li>
                <li class="active"><a href="review.html">口コミ</a></li>
            </ul>
        </nav>

        
        <section>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 class="section-title" style="margin-bottom: 0; margin-top: 0;">お客様からの口コミ</h2>
                <button id="openModal" class="btn-reserve-brand" style="font-size: 14px; padding: 10px 20px; margin: 0; border: none; cursor: pointer; height: auto; line-height: 1;">口コミを投稿する</button>
            </div>
            
            <div id="reviews-container">
                <p style="text-align: center; padding: 20px;">読み込み中...</p>
            </div>
        </section>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>口コミ投稿</h2>
                <span class="close">&times;</span>
            </div>
            <form id="reviewForm">
                <div class="form-group">
                    <label>ニックネーム</label>
                    <input type="text" name="nickname" required placeholder="例：ちひろ">
                </div>
                <div class="form-group">
                    <label>プロフィール</label>
                    <div style="display: flex; gap: 5px;">
                        <select name="gender" required>
                            <option value="">性別</option>
                            <option value="女性">女性</option>
                            <option value="男性">男性</option>
                            <option value="回答しない">回答しない</option>
                        </select>
                        <select name="age" required>
                            <option value="">年代</option>
                            <option value="10代">10代</option>
                            <option value="20代">20代</option>
                            <option value="30代">30代</option>
                            <option value="40代">40代</option>
                            <option value="50代">50代</option>
                            <option value="60代以上">60代以上</option>
                        </select>
                        <select name="job" required>
                            <option value="">職業</option>
                            <option value="会社員">会社員</option>
                            <option value="主婦">主婦</option>
                            <option value="学生">学生</option>
                            <option value="自営業">自営業</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>満足度（星評価）</label>
                    <select name="stars" required>
                        <option value="5">★★★★★ 5</option>
                        <option value="4">★★★★☆ 4</option>
                        <option value="3">★★★☆☆ 3</option>
                        <option value="2">★★☆☆☆ 2</option>
                        <option value="1">★☆☆☆☆ 1</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>コメント</label>
                    <textarea name="comment" rows="5" required placeholder="施術の感想をご記入ください"></textarea>
                </div>
                <button type="submit" class="btn-submit">投稿する</button>
            </form>
        </div>
    </div>

    <style>
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fefefe; margin: 10% auto; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; }
        .modal-header { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { margin: 0; font-size: 1.2rem; color: #ff9800; }
        .close { font-size: 28px; font-weight: bold; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background: #ff9800; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; transition: background 0.3s; }
        .btn-submit:hover { background: #e68a00; }
    </style>

    <script>
        const getApiUrl = (path) => {
            const hostname = window.location.hostname;
            const isProdPlesk = hostname === 'www.apollo-seikotsuin.jp' || hostname === 'apollo-seikotsuin.jp';
            return isProdPlesk ? `https://apollo-seikotsuin.pages.dev${path}` : path;
        };

        // Fetch and display reviews
        async function loadReviews() {
            try {
                const res = await fetch(getApiUrl('/api/reviews'));
                if (!res.ok) throw new Error('Failed to fetch reviews');
                const reviews = await res.json();
                const container = document.getElementById('reviews-container');
                
                if (reviews.length === 0) {
                    container.innerHTML = '<p style="text-align: center; padding: 20px;">まだ口コミはありません。</p>';
                    return;
                }

                container.innerHTML = reviews.map(r => `
                    <div class="review-card">
                        <div class="review-header">
                            <div class="review-user-info">
                                <i class="fas fa-user-circle"></i> ${r.nickname}さん <span class="review-user-meta">(${r.profile})</span>
                            </div>
                            <div class="review-date">${r.date}</div>
                        </div>
                        <div class="review-rating-row">
                            <span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)} ${r.stars}.0</span>
                        </div>
                        <div class="review-content">${r.comment.replace(/\n/g, '<br>')}</div>
                        ${r.reply ? `
                        <div class="review-reply">
                            <div class="reply-title">院長からの返信</div>
                            ${r.reply.replace(/\n/g, '<br>')}
                        </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                const container = document.getElementById('reviews-container');
                container.innerHTML = `
                    <div class="review-card">
                        <div class="review-header">
                            <div class="review-user-info">
                                <i class="fas fa-user-circle"></i> 千春さん <span class="review-user-meta">(女性/50代/主婦)</span>
                            </div>
                            <div class="review-date">2025/1/11</div>
                        </div>
                        <div class="review-rating-row">
                            <span class="stars">★★★★★ 5.0</span>
                        </div>
                        <div class="review-content">今回で3回目の施術でした。<br>いつもありがとうございます…<br>しっかり学ばれ資格を持った方の施術なので痛みの原因や改善方法等のアドバイスも頂けてとても心強く思っております。<br>その日の体調によって施術はお任せしております。<br>それだけ信頼しているとも言えます。<br>これからも定期的に通って心身ともにリラックス出来たらと思います。<br>これからも宜しくお願いします。</div>
                        <div class="review-reply">
                            <div class="reply-title">院長からの返信</div>
                            千春さん様<br>たくさんの整骨院がある中、当整骨院を選んで頂きありがとうございました^_^ <br>いつもご利用いただきありがとうございます！お身体の辛さは日によって変わりますのでお任せいただき嬉しいです。今後ともよろしくお願いします！
                        </div>
                    </div>
                    <div class="review-card">
                        <div class="review-header">
                            <div class="review-user-info">
                                <i class="fas fa-user-circle"></i> あっこさん <span class="review-user-meta">(女性/50代/主婦)</span>
                            </div>
                            <div class="review-date">2024/12/10</div>
                        </div>
                        <div class="review-rating-row">
                            <span class="stars">★★★★★ 5.0</span>
                        </div>
                        <div class="review-content">首の凝りがひひどくて行きました。<br>全身のマッサージでお願いしましたが、先生の言うとおり首と上半身だけのマッサージでお願いした方がいい気がしました。<br>あっという間の30分でしたがとってもリラックスできました。<br>またよろしくお願いします。</div>
                        <div class="review-reply">
                            <div class="reply-title">院長からの返信</div>
                            あっこさん様、ご来院ありがとうございました！首の凝りが少しでも楽になったのであれば幸いです。またお疲れが溜まる前にぜひメンテナンスにお越しくださいね。
                        </div>
                    </div>
                `;
            }
        }

        // Modal Logic
        const modal = document.getElementById("reviewModal");
        const btn = document.getElementById("openModal");
        const span = document.getElementsByClassName("close")[0];

        btn.onclick = () => modal.style.display = "block";
        span.onclick = () => modal.style.display = "none";
        window.onclick = (event) => { if (event.target == modal) modal.style.display = "none"; }

        // Form Submission
        document.getElementById('reviewForm').onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = {
                nickname: fd.get('nickname'),
                profile: `${fd.get('gender')}/${fd.get('age')}/${fd.get('job')}`,
                stars: parseInt(fd.get('stars')),
                comment: fd.get('comment')
            };

            try {
                const res = await fetch(getApiUrl('/api/reviews'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    modal.style.display = "none";
                    e.target.reset();
                    loadReviews();
                    alert('投稿ありがとうございます！');
                }
            } catch (err) {
                alert('投稿に失敗しました。');
            }
        };

        loadReviews();
    </script>

    <footer class="footer">
        <p>&copy; アポロ整骨院 公式サイト All Rights Reserved.</p>
    </footer>

</body>
</html>
